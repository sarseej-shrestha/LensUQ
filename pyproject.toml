[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lensuq"
version = "0.1.0"
description = "Measure prediction sensitivity across defensible preprocessing pipelines"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Sarseej Shrestha"}]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "build>=1.2"]

[project.urls]
Repository = "https://github.com/sarseej-shrestha/LensUQ"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
